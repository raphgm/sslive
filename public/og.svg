<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="60%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.7">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#fb923c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decorative pill in top-right -->
  <g transform="translate(880, 60)">
    <rect width="260" height="48" rx="24" fill="#ffffff" fill-opacity="0.15"/>
    <text x="130" y="32" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">SKILL.SCH</text>
  </g>

  <!-- Logo cluster -->
  <g transform="translate(72, 80)">
    <circle cx="20" cy="20" r="20" fill="#fbbf24" opacity="0.9"/>
    <circle cx="44" cy="20" r="20" fill="#a855f7" opacity="0.9"/>
    <circle cx="68" cy="20" r="20" fill="#22d3ee" opacity="0.9"/>
    <text x="100" y="30" font-family="Plus Jakarta Sans, sans-serif" font-size="28" font-weight="800" fill="#fff">SSlive</text>
  </g>

  <!-- Badge -->
  <g transform="translate(72, 200)">
    <rect width="190" height="44" rx="22" fill="#fff" fill-opacity="0.18"/>
    <text x="95" y="29" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="2">LIVE QUIZZES</text>
  </g>

  <!-- Headline -->
  <g transform="translate(72, 280)">
    <text x="0" y="0" font-family="Plus Jakarta Sans, sans-serif" font-size="68" font-weight="800" fill="#fff" letter-spacing="-1.5">SSlive</text>
  </g>

  <!-- Subline -->
  <text x="72" y="408" font-family="Inter, sans-serif" font-size="26" font-weight="500" fill="#fff" fill-opacity="0.85" letter-spacing="-0.3">Live AI quizzes, debates &amp; challenges</text>

  <!-- Bottom URL -->
  <g transform="translate(72, 560)">
    <circle cx="8" cy="8" r="8" fill="#34d399"/>
    <text x="28" y="14" font-family="JetBrains Mono, monospace" font-size="20" font-weight="600" fill="#fff" fill-opacity="0.85">skill-sch.com/sslive</text>
  </g>

  <!-- Rocket icon bottom-right -->
  <text x="1110" y="580" font-size="80" text-anchor="end" opacity="0.85">🚀</text>
</svg>
